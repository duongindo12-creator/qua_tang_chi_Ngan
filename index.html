<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10 - Gửi Chị Ngân</title>
    <!-- Nhúng Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #fff5f7; /* Đổi thành nền trắng hồng cực kỳ nhạt, dịu mắt */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng rơi thẳng, tàn ảnh và vừa vặn */
        .falling-item {
            position: absolute;
            top: -50px;
            color: rgba(255, 77, 109, 0.65);
            font-size: 18px;
            font-weight: bold;
            user-select: none;
            pointer-events: none;
            animation: fallStraight linear infinite;
            z-index: 1;
        }

        @keyframes fallStraight {
            0% {
                transform: translateY(-50px);
                opacity: 1;
                filter: blur(0px);
            }
            80% {
                opacity: 0.5;
                filter: blur(0.5px);
            }
            100% {
                transform: translateY(105vh);
                opacity: 0; /* Tàn ảnh mờ dần */
                filter: blur(1.5px);
            }
        }

        /* Tiêu đề phía trên */
        h2 {
            color: #d90429;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
            animation: bounce 1.5s infinite;
            z-index: 2;
        }

        /* Trái tim */
        .heart-btn {
            position: relative;
            width: 90px;
            height: 90px;
            background-color: #ff4d6d;
            transform: rotate(-45deg);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(217, 4, 41, 0.25);
            transition: transform 0.3s ease, background-color 0.3s ease;
            animation: pulse 1.2s infinite alternate;
            z-index: 2;
            margin-bottom: 20px;
        }

        .heart-btn::before,
        .heart-btn::after {
            content: "";
            position: absolute;
            width: 90px;
            height: 90px;
            background-color: #ff4d6d;
            border-radius: 50%;
        }

        .heart-btn::before {
            top: -45px;
            left: 0;
        }

        .heart-btn::after {
            left: 45px;
            top: 0;
        }

        /* Chữ hiển thị bên trong trái tim */
        .heart-btn span {
            position: absolute;
            transform: rotate(45deg);
            color: white;
            font-weight: bold;
            font-size: 13px;
            z-index: 3;
            text-align: center;
            width: 90px;
            line-height: 1.2;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .heart-btn:hover {
            background-color: #ef233c;
        }
        .heart-btn:hover::before,
        .heart-btn:hover::after {
            background-color: #ef233c;
        }

        /* Dòng chữ "Click vào đây" nằm ở DƯỚI trái tim kèm hiệu ứng neon */
        .click-text {
            color: #d90429;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 2;
            text-shadow: 0 0 5px #ffb3c1, 0 0 10px #ff4d6d;
            animation: neonGlow 1.5s ease-in-out infinite alternate;
        }

        .click-text:hover {
            transform: scale(1.1);
        }

        @keyframes neonGlow {
            from {
                text-shadow: 0 0 5px #fff, 0 0 10px #ff4d6d, 0 0 15px #ff4d6d;
            }
            to {
                text-shadow: 0 0 10px #fff, 0 0 20px #ff758f, 0 0 30px #ff4d6d;
            }
        }

        /* Hộp thư */
        .box-mail {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 480px;
            background: #ffffff;
            border: 2px solid #ff4d6d;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 25px 20px 20px 20px;
            z-index: 10;
            animation: fadeIn 0.4s ease-in-out;
        }

        .mail h1 {
            color: #d90429;
            font-size: 20px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .mail p {
            color: #333;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 15px;
            text-align: justify;
        }

        .mail .sign {
            text-align: right;
            font-style: italic;
            color: #d90429;
            font-weight: bold;
            font-size: 15px;
        }

        /* Nút đóng hộp thư */
        .btn-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 22px;
            color: #d90429;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -55%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes pulse {
            0% { transform: rotate(-45deg) scale(1); }
            100% { transform: rotate(-45deg) scale(1.08); }
        }
    </style>
</head>
<body>

    <!-- Tiêu đề -->
    <h2>Nhân dịp ngày 20/10 &lt;3</h2>

    <!-- Trái tim -->
    <div class="heart-btn" onclick="openMail()">
        <span>Gửi Chị Ngân</span>
    </div>

    <!-- Chữ "Click vào đây" nằm ở dưới trái tim -->
    <div class="click-text" onclick="openMail()">✨ Click vào đây ✨</div>

    <!-- Hộp thư nội dung -->
    <div class="box-mail" id="boxMail">
        <button class="btn-close" onclick="closeMail()">&times;</button>
        <div class="mail">
            <h1 style="text-align: center;">
                💖 Gửi Chị Ngân yêu dấu!!!💖
            </h1>
