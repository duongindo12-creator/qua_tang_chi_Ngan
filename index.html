<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chúc Mừng Ngày 20/10 - Gửi Chị Ngân</title>
    <!-- Nhúng Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(180deg, #ffdeeb 0%, #ffc2d1 60%, #ff9ebb 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: fixed;
        }

        /* Hiệu ứng chữ và icon rơi nhẹ nhàng */
        .falling-item {
            position: absolute;
            top: -50px;
            color: rgba(255, 77, 109, 0.7);
            font-size: 18px;
            font-weight: bold;
            user-select: none;
            pointer-events: none !important;
            animation: fallStraight linear infinite;
            z-index: 1;
        }

        @keyframes fallStraight {
            0% {
                transform: translateY(-50px);
                opacity: 1;
                filter: blur(0px);
            }
            80% {
                opacity: 0.5;
                filter: blur(0.5px);
            }
            100% {
                transform: translateY(105vh);
                opacity: 0;
                filter: blur(1.5px);
            }
        }
