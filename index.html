        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            /* Background hồng nhẹ nhàng, xinh xắn */
            background: linear-gradient(180deg, #ffdeeb 0%, #ffc2d1 60%, #ff9ebb 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng chữ và icon rơi nhẹ nhàng, có tàn ảnh */
        .falling-item {
            position: absolute;
            top: -50px;
            color: rgba(255, 77, 109, 0.7);
            font-size: 18px;
            font-weight: bold;
            user-select: none;
            pointer-events: none !important;
            animation: fallStraight linear infinite;
            z-index: 1;
        }

        @keyframes fallStraight {
            0% {
                transform: translateY(-50px);
                opacity: 1;
                filter: blur(0px);
            }
            80% {
                opacity: 0.5;
                filter: blur(0.5px);
            }
            100% {
                transform: translateY(105vh);
                opacity: 0;
                filter: blur(1.5px);
            }
        }
