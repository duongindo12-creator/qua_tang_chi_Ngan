<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày 20/10 - Gửi Chị Ngân</title>
    <!-- Nhúng Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #ffccd5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng rơi thẳng, dày hơn và có tàn ảnh */
        .falling-item {
            position: absolute;
            top: -50px;
            color: rgba(255, 77, 109, 0.7);
            font-size: 18px;
            font-weight: bold;
            user-select: none;
            pointer-events: none;
            animation: fallStraight linear infinite;
            z-index: 1;
        }

        @keyframes fallStraight {
            0% {
                transform: translateY(-50px);
                opacity: 1;
                filter: blur(0px);
            }
            80% {
                opacity: 0.6;
                filter: blur(0.5px);
            }
            100% {
                transform: translateY(105vh);
                opacity: 0; /* Hiệu ứng tàn ảnh mờ dần khi biến mất */
                filter: blur(1.5px);
            }
        }

        /* Tiêu đề phía trên */
        h2 {
            color: #d90429;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
            animation: bounce 1.5s infinite;
            z-index: 2;
        }
